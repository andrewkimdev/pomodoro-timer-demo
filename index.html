<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Consolas, monospace;
            background-color: #0a0a0a;
            color: #00ff41;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .container {
            text-align: center;
            padding: 2rem;
            border: 1px solid #00ff41;
            background-color: #0d0d0d;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .timer-display {
            font-size: 5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.7);
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #1a1a1a;
            border: 1px solid #00ff41;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #00ff41;
            width: 100%;
            transition: width 0.5s linear;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.8);
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        button {
            font-family: 'Courier New', Consolas, monospace;
            font-size: 1rem;
            padding: 0.75rem 1.5rem;
            background-color: transparent;
            color: #00ff41;
            border: 1px solid #00ff41;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.6);
        }

        button:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #00aa2a;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>// Pomodoro</h1>
        <div class="timer-display" id="timer">25:00</div>
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
        <div class="status" id="status">[ READY ]</div>
    </div>

    <script>
        const POMODORO_DURATION = 25 * 60; // 25 minutes in seconds

        let timeRemaining = POMODORO_DURATION;
        let timerId = null;
        let isRunning = false;

        const timerDisplay = document.getElementById('timer');
        const progressBar = document.getElementById('progress');
        const statusDisplay = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            const timeFormatted = formatTime(timeRemaining);
            timerDisplay.textContent = timeFormatted;
            document.title = `${timeFormatted} - Pomodoro`;
            const progressPercent = (timeRemaining / POMODORO_DURATION) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }

        function playAlarm() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const beepCount = 3;
            const beepDuration = 0.15;
            const beepGap = 0.1;

            for (let i = 0; i < beepCount; i++) {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.frequency.value = 880;
                oscillator.type = 'square';

                const startTime = audioCtx.currentTime + i * (beepDuration + beepGap);
                gainNode.gain.setValueAtTime(0.3, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + beepDuration);

                oscillator.start(startTime);
                oscillator.stop(startTime + beepDuration);
            }
        }

        function tick() {
            if (timeRemaining > 0) {
                timeRemaining--;
                updateDisplay();
            } else {
                complete();
            }
        }

        function start() {
            if (!isRunning && timeRemaining > 0) {
                isRunning = true;
                statusDisplay.textContent = '[ RUNNING ]';
                timerId = setInterval(tick, 1000);
            }
        }

        function pause() {
            if (isRunning) {
                isRunning = false;
                statusDisplay.textContent = '[ PAUSED ]';
                clearInterval(timerId);
                timerId = null;
            }
        }

        function reset() {
            pause();
            timeRemaining = POMODORO_DURATION;
            updateDisplay();
            statusDisplay.textContent = '[ READY ]';
        }

        function complete() {
            pause();
            statusDisplay.textContent = '[ COMPLETE ]';
            document.title = 'DONE! - Pomodoro';
            timerDisplay.style.animation = 'pulse 0.5s ease-in-out infinite';
            playAlarm();
        }

        startBtn.addEventListener('click', start);
        pauseBtn.addEventListener('click', pause);
        resetBtn.addEventListener('click', reset);

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
