<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#000000"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00ff41" stroke-width="16"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00ff41" stroke-width="4" opacity="0.5"/>
  <!-- Hour markers -->
  <line x1="256" y1="76" x2="256" y2="96" stroke="#00ff41" stroke-width="8"/>
  <line x1="256" y1="416" x2="256" y2="436" stroke="#00ff41" stroke-width="8"/>
  <line x1="76" y1="256" x2="96" y2="256" stroke="#00ff41" stroke-width="8"/>
  <line x1="416" y1="256" x2="436" y2="256" stroke="#00ff41" stroke-width="8"/>
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="120" stroke="#00ff41" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="340" y2="256" stroke="#00ff41" stroke-width="6" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#00ff41"/>
  <!-- Glow effect -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00ff41" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
